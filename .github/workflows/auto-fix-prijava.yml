name: Auto-fix prijava

# Kad radnica klikne "Prijavi problem" u softveru, backend otvori GitHub issue
# sa labelom 'prijava-radnice'. Ovaj workflow se automatski okida i pokrece
# Claude Code da diagnoza + popravi + merge (per instrukcije u CLAUDE.md).
#
# Marko vise ne mora da prosledjuje screenshot - Claude vidi issue direktno
# i sam pokrece flow rešavanja.
#
# Zahtevi (jednom podesi):
#   - GitHub secret: ANTHROPIC_API_KEY (ili CLAUDE_CODE_OAUTH_TOKEN ako imas Max)
#   - Repo permissions: Settings → Actions → General → Workflow permissions:
#     "Read and write" + "Allow GitHub Actions to create and approve pull requests"

on:
  issues:
    types: [opened]
  # Manual trigger za testiranje (Marko 10.6.: provera da li ANTHROPIC_API_KEY radi)
  workflow_dispatch:

jobs:
  auto-fix:
    # Aktiviraj se SAMO za prijave od radnica (label 'prijava-radnice')
    if: contains(github.event.issue.labels.*.name, 'prijava-radnice')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write  # potrebno za claude-code-action OIDC autentikaciju
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # KRITICNO (2.7.2026): novije verzije @v1 action-a NE daju nikakve default
          # dozvole za alate - bez --allowedTools Claude uradi dijagnozu pa mu SVAKI
          # git push / gh / edit bude odbijen (permission_denials_count u logu) i run
          # "uspe" bez ikakvog rezultata. Tako su prijave #74 i #76 prosle bez fix-a.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,TodoWrite"
            --max-turns 80
          prompt: |
            Nova prijava problema je upravo stigla.

            Issue #${{ github.event.issue.number }}:
            Naslov: ${{ github.event.issue.title }}

            Opis:
            ${{ github.event.issue.body }}

            Postupi tačno prema instrukcijama u CLAUDE.md (sekcija "Automatsko rešavanje prijava problema").
            Cilj: popraviti pre nego što radnica primeti problem ponovo.

            OBAVEZNO na kraju (čak i ako ništa ne menjaš): ostavi komentar na issue #${{ github.event.issue.number }}
            (gh issue comment) sa nalazom i šta si uradio. Ako si popravio i mergovao: zatvori issue
            (gh issue close) i označi prijavu rešenom po koraku 6 iz CLAUDE.md. Ako NIJE bezbedno
            automatski mergovati: otvori PR sa nalazom i to napiši u komentaru. Tihi završetak bez
            komentara je neuspeh run-a.
